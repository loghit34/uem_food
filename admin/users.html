<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Users</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="brand-logo">👑 UEM<span>EATS Admin</span></a>
      <a href="dashboard.html" class="btn btn-outline btn-sm">&larr; Back to Dashboard</a>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
        <h1 class="section-title" style="margin-bottom: 0;">Registered Campus Users</h1>
        <div class="search-bar-wrap" style="margin-top: 0; max-width: 320px;">
          <input type="text" id="user-search" placeholder="Search name, email, or role...">
        </div>
      </div>

      <div id="users-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <!-- Loaded via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/users.js"></script>
</body>
</html>
