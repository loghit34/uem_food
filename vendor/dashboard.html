<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Dashboard - UEM EATS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/vendor.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="brand-logo">
        🏪 UEM<span>EATS Vendor</span>
      </a>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="nav-user-name" style="font-weight: 600; color: var(--secondary);"></span>
        <span class="badge badge-primary">VENDOR</span>
        <button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <div class="vendor-layout">
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="sidebar-link active">📊 Dashboard</a></li>
        <li><a href="orders.html" class="sidebar-link">📦 Live Orders</a></li>
        <li><a href="menu.html" class="sidebar-link">🍔 Menu Manager</a></li>
        <li><a href="analytics.html" class="sidebar-link">📈 Sales & Analytics</a></li>
      </ul>
    </aside>

    <main class="vendor-main">
      <h1 class="section-title">Dashboard Overview</h1>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Today's Orders</div>
          <div id="stat-today-orders" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Today's Sales</div>
          <div id="stat-today-sales" class="stat-value">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Orders</div>
          <div id="stat-total-orders" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div id="stat-total-sales" class="stat-value">₹0</div>
        </div>
      </div>

      <div class="section-title" style="margin-top: 2rem;">
        <span>Recent Confirmed Paid Orders</span>
        <a href="orders.html" class="btn btn-outline btn-sm">View All Orders</a>
      </div>
      <div id="recent-orders-list">
        <!-- Rendered via dashboard.js -->
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/vendor/dashboard.js"></script>
</body>
</html>
