<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Analytics - Vendor Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/vendor.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="brand-logo">
        🏪 UEM<span>EATS Vendor</span>
      </a>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="nav-user-name" style="font-weight: 600; color: var(--secondary);"></span>
        <button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <div class="vendor-layout">
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="sidebar-link">📊 Dashboard</a></li>
        <li><a href="orders.html" class="sidebar-link">📦 Live Orders</a></li>
        <li><a href="menu.html" class="sidebar-link">🍔 Menu Manager</a></li>
        <li><a href="analytics.html" class="sidebar-link active">📈 Sales & Analytics</a></li>
      </ul>
    </aside>

    <main class="vendor-main">
      <h1 class="section-title">Revenue & Sales Performance</h1>

      <div class="stats-grid" style="margin-bottom: 2rem;">
        <div class="stat-card">
          <div class="stat-label">Today's Revenue</div>
          <div id="ana-today-sales" class="stat-value">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Today's Orders</div>
          <div id="ana-today-orders" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Lifetime Revenue</div>
          <div id="ana-total-sales" class="stat-value">₹0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Lifetime Orders</div>
          <div id="ana-total-orders" class="stat-value">0</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/vendor/analytics.js"></script>
</body>
</html>
