<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management - Vendor Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/vendor.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="brand-logo">
        🏪 UEM<span>EATS Vendor</span>
      </a>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="nav-user-name" style="font-weight: 600; color: var(--secondary);"></span>
        <button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <div class="vendor-layout">
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="sidebar-link">📊 Dashboard</a></li>
        <li><a href="orders.html" class="sidebar-link">📦 Live Orders</a></li>
        <li><a href="menu.html" class="sidebar-link active">🍔 Menu Manager</a></li>
        <li><a href="analytics.html" class="sidebar-link">📈 Sales & Analytics</a></li>
      </ul>
    </aside>

    <main class="vendor-main">
      <div class="section-title">
        <span>Your Menu Items</span>
        <button onclick="showAddItemModal()" class="btn btn-primary btn-sm">+ Add New Dish</button>
      </div>

      <!-- Add Item Form Modal/Card -->
      <div id="add-item-card" class="card" style="display:none; padding: 1.5rem; margin-bottom: 2rem;">
        <h3 style="margin-bottom: 1rem; color: var(--secondary);">Add New Menu Item</h3>
        <form id="add-item-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
              <label style="font-size: 0.85rem; font-weight: 600;">Dish Name</label>
              <input type="text" id="item-name" class="form-control" placeholder="e.g. Masala Dosa" required>
            </div>
            <div>
              <label style="font-size: 0.85rem; font-weight: 600;">Price (₹)</label>
              <input type="number" id="item-price" class="form-control" placeholder="60" min="1" step="0.5" required>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
              <label style="font-size: 0.85rem; font-weight: 600;">Category</label>
              <input type="text" id="item-category" class="form-control" placeholder="e.g. Breakfast / Beverages">
            </div>
            <div>
              <label style="font-size: 0.85rem; font-weight: 600;">Image URL</label>
              <input type="url" id="item-image" class="form-control" placeholder="https://...">
            </div>
          </div>
          <div style="margin-bottom: 1rem;">
            <label style="font-size: 0.85rem; font-weight: 600;">Description</label>
            <textarea id="item-desc" class="form-control" rows="2" placeholder="Served with coconut chutney & sambar"></textarea>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <button type="submit" class="btn btn-primary">Save Dish</button>
            <button type="button" onclick="hideAddItemModal()" class="btn btn-secondary">Cancel</button>
          </div>
        </form>
      </div>

      <div id="vendor-menu-grid" class="grid-cards">
        <!-- Rendered via menu.js -->
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/vendor/menu.js"></script>
</body>
</html>
