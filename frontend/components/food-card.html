<!-- Reusable Food Card Template -->
<div class="card food-card">
  <img src="{{image}}" alt="{{name}}" class="food-img">
  <div class="food-details">
    <span class="food-category">{{category}}</span>
    <h3 class="food-title">{{name}}</h3>
    <p class="food-desc">{{description}}</p>
    <div class="food-price-action">
      <span class="food-price">{{price}}</span>
      <button class="btn btn-primary btn-sm">+ Add</button>
    </div>
  </div>
</div>
