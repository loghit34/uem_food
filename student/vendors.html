<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Canteens - UEM EATS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        🍱 UEM<span>EATS</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="vendors.html" class="nav-link active">Canteens</a></li>
          <li><a href="orders.html" class="nav-link">My Orders</a></li>
          <li class="cart-badge-wrap">
            <a href="cart.html" class="nav-link">🛒 Cart <span id="cart-count-badge" class="cart-count" style="display:none;">0</span></a>
          </li>
          <li><button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
        <h1 class="section-title" style="margin-bottom: 0;">Campus Canteens & Stalls</h1>
        <div class="search-bar-wrap" style="max-width: 100%; margin-top: 0;">
          <input type="text" id="vendor-search" placeholder="Search canteen name or location...">
        </div>
      </div>

      <div id="vendors-list" class="grid-cards">
        <!-- Rendered via JS -->
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-bottom-nav-inner">
      <a href="home.html" class="mobile-nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="vendors.html" class="mobile-nav-item active">
        <span class="nav-icon">🍱</span>
        <span>Canteens</span>
      </a>
      <a href="cart.html" class="mobile-nav-item">
        <span class="nav-icon">🛒</span>
        <span>Cart</span>
        <span class="mobile-nav-badge" style="display:none;">0</span>
      </a>
      <a href="orders.html" class="mobile-nav-item">
        <span class="nav-icon">📋</span>
        <span>Orders</span>
      </a>
      <button onclick="Auth.logout()" class="mobile-nav-item" style="border:none; background:none;">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/student/vendors.js"></script>
</body>
</html>
