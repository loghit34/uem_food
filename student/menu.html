<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - UEM EATS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        🍱 UEM<span>EATS</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="vendors.html" class="nav-link">Canteens</a></li>
          <li><a href="orders.html" class="nav-link">My Orders</a></li>
          <li class="cart-badge-wrap">
            <a href="cart.html" class="nav-link">🛒 Cart <span id="cart-count-badge" class="cart-count" style="display:none;">0</span></a>
          </li>
          <li><button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 1.25rem;">
        <a href="vendors.html" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600; display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 0.75rem;">
          &larr; Back to Canteens
        </a>
        <div id="vendor-header">
          <h1 id="vendor-name-title" style="font-size: 1.6rem; color: var(--secondary); margin-bottom: 0.2rem;">Loading Canteen...</h1>
          <p id="vendor-location-title" style="color: var(--text-muted); font-size: 0.9rem;"></p>
        </div>
      </div>

      <!-- Menu Category Chips -->
      <div id="menu-category-chips" class="category-chips-scroll">
        <button class="category-chip active" onclick="filterMenuCategory('ALL')">🍽️ All</button>
        <button class="category-chip" onclick="filterMenuCategory('SNACKS')">🍟 Snacks</button>
        <button class="category-chip" onclick="filterMenuCategory('BEVERAGES')">☕ Beverages</button>
        <button class="category-chip" onclick="filterMenuCategory('MEALS')">🍛 Meals</button>
        <button class="category-chip" onclick="filterMenuCategory('FAST FOOD')">🍕 Fast Food</button>
      </div>

      <div class="section-title">Menu Items</div>
      <div id="menu-items-grid" class="grid-cards">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Floating Sticky Bottom Cart Bar for Quick Mobile Checkout -->
  <div id="floating-cart-bar" class="floating-cart-bar" style="display: none;" onclick="window.location.href='cart.html'">
    <div class="floating-cart-info">
      <span id="floating-cart-count" class="floating-cart-count">0 items</span>
      <span id="floating-cart-total" class="floating-cart-total">₹0.00</span>
    </div>
    <div class="floating-cart-action">
      <span>View Cart</span>
      <span>🛒 &rarr;</span>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-bottom-nav-inner">
      <a href="home.html" class="mobile-nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="vendors.html" class="mobile-nav-item active">
        <span class="nav-icon">🍱</span>
        <span>Canteens</span>
      </a>
      <a href="cart.html" class="mobile-nav-item">
        <span class="nav-icon">🛒</span>
        <span>Cart</span>
        <span class="mobile-nav-badge" style="display:none;">0</span>
      </a>
      <a href="orders.html" class="mobile-nav-item">
        <span class="nav-icon">📋</span>
        <span>Orders</span>
      </a>
      <button onclick="Auth.logout()" class="mobile-nav-item" style="border:none; background:none;">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/student/menu.js"></script>
</body>
</html>
