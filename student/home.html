<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - UEM EATS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        🍱 UEM<span>EATS</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="home.html" class="nav-link active">Home</a></li>
          <li><a href="vendors.html" class="nav-link">Canteens</a></li>
          <li><a href="orders.html" class="nav-link">My Orders</a></li>
          <li class="cart-badge-wrap">
            <a href="cart.html" class="nav-link">🛒 Cart <span id="cart-count-badge" class="cart-count" style="display:none;">0</span></a>
          </li>
          <li><span id="nav-user-name" style="font-weight: 600; color: var(--secondary);"></span></li>
          <li><button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button></li>
        </ul>
      </nav>
      <!-- Mobile Quick Logout Button in Header -->
      <button onclick="Auth.logout()" class="btn btn-outline btn-sm" style="display: none;" id="mobile-logout-btn" title="Logout">🚪</button>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="hero-banner">
        <h1>Welcome, <span id="welcome-name">Foodie</span>! 👋</h1>
        <p>Order fresh campus meals without waiting in canteen lines.</p>
        <div class="search-bar-wrap">
          <input type="text" id="home-search" placeholder="Search canteens, biryani, rolls, snacks...">
        </div>
      </div>

      <!-- Quick Category Filter Chips -->
      <div class="category-chips-scroll">
        <button class="category-chip active" onclick="filterCategory('ALL')">🍽️ All</button>
        <button class="category-chip" onclick="filterCategory('SNACKS')">🍟 Snacks</button>
        <button class="category-chip" onclick="filterCategory('BEVERAGES')">☕ Beverages</button>
        <button class="category-chip" onclick="filterCategory('MEALS')">🍛 Meals</button>
        <button class="category-chip" onclick="filterCategory('FAST FOOD')">🍕 Fast Food</button>
      </div>

      <div class="section-title">
        <span>Campus Outlets</span>
        <a href="vendors.html" style="font-size: 0.95rem; color: var(--primary);">View All &rarr;</a>
      </div>

      <div id="featured-vendors" class="grid-cards">
        <!-- Dynamic vendor cards -->
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-bottom-nav-inner">
      <a href="home.html" class="mobile-nav-item active">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="vendors.html" class="mobile-nav-item">
        <span class="nav-icon">🍱</span>
        <span>Canteens</span>
      </a>
      <a href="cart.html" class="mobile-nav-item">
        <span class="nav-icon">🛒</span>
        <span>Cart</span>
        <span class="mobile-nav-badge" style="display:none;">0</span>
      </a>
      <a href="orders.html" class="mobile-nav-item">
        <span class="nav-icon">📋</span>
        <span>Orders</span>
      </a>
      <button onclick="Auth.logout()" class="mobile-nav-item" style="border:none; background:none;">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 UEM EATS V2</p>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/student/home.js"></script>
</body>
</html>
