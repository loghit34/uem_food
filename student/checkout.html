<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - UEM EATS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
  <!-- PhonePe uses server-side redirect — no frontend SDK required -->
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        🍱 UEM<span>EATS</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="orders.html" class="nav-link">My Orders</a></li>
          <li><button onclick="Auth.logout()" class="btn btn-outline btn-sm">Logout</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width: 800px;">
      <h1 class="section-title">Order Checkout & Payment</h1>
      <div id="checkout-container">
        <!-- Rendered via checkout.js & payment.js -->
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-bottom-nav-inner">
      <a href="home.html" class="mobile-nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="vendors.html" class="mobile-nav-item">
        <span class="nav-icon">🍱</span>
        <span>Canteens</span>
      </a>
      <a href="cart.html" class="mobile-nav-item active">
        <span class="nav-icon">🛒</span>
        <span>Cart</span>
        <span class="mobile-nav-badge" style="display:none;">0</span>
      </a>
      <a href="orders.html" class="mobile-nav-item">
        <span class="nav-icon">📋</span>
        <span>Orders</span>
      </a>
      <button onclick="Auth.logout()" class="mobile-nav-item" style="border:none; background:none;">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/student/payment.js"></script>
  <script src="../js/student/checkout.js"></script>
</body>
</html>
