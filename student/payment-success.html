<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - UEM EATS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="home.html" class="brand-logo">
        🍱 UEM<span>EATS</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="orders.html" class="nav-link">My Orders</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width: 600px; text-align: center; padding-top: 3rem;">
      <div class="card" style="padding: 3rem 2rem;">
        <div style="font-size: 4rem; color: var(--accent); margin-bottom: 1rem;">✅</div>
        <h1 style="color: var(--secondary); margin-bottom: 0.5rem;">Payment Confirmed!</h1>
        <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 1.5rem;">
          Your order has been paid and sent straight to the canteen kitchen.
        </p>

        <div style="background: #f8fafc; border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 2rem; text-align: left;">
          <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem;">
            <span style="color: var(--text-muted);">Order ID:</span>
            <strong id="confirmed-order-id" style="color: var(--secondary);">#ORD-XXXX</strong>
          </div>
          <div style="display:flex; justify-content:space-between;">
            <span style="color: var(--text-muted);">Status:</span>
            <span class="badge badge-success">PAID</span>
          </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center;">
          <a href="orders.html" class="btn btn-primary">View All Orders</a>
          <a href="home.html" class="btn btn-outline">Back to Home</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-bottom-nav-inner">
      <a href="home.html" class="mobile-nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="vendors.html" class="mobile-nav-item">
        <span class="nav-icon">🍱</span>
        <span>Canteens</span>
      </a>
      <a href="cart.html" class="mobile-nav-item">
        <span class="nav-icon">🛒</span>
        <span>Cart</span>
        <span class="mobile-nav-badge" style="display:none;">0</span>
      </a>
      <a href="orders.html" class="mobile-nav-item active">
        <span class="nav-icon">📋</span>
        <span>Orders</span>
      </a>
      <button onclick="Auth.logout()" class="mobile-nav-item" style="border:none; background:none;">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    Auth.requireAuth(["STUDENT", "FACULTY"]);

    const params = new URLSearchParams(window.location.search);
    const txnId = params.get("txnId");
    const orderIdParam = params.get("orderId");
    const confirmedEl = document.getElementById("confirmed-order-id");

    async function confirmPhonePeOrder() {
      // If orderId already in URL (direct confirm), just display it
      if (orderIdParam) {
        confirmedEl.textContent = `#${orderIdParam.slice(0, 8).toUpperCase()}`;
        return;
      }

      if (!txnId) {
        confirmedEl.textContent = "#UNKNOWN";
        return;
      }

      confirmedEl.textContent = "⏳ Verifying...";

      try {
        // Retrieve cart items saved before redirect
        const cart = UEM.getCart();
        const vendorId = cart.pendingVendorId || cart.vendorId;
        const items = cart.items || [];

        const res = await UEM.apiFetch("/payment/confirm", {
          method: "POST",
          body: JSON.stringify({
            merchantTransactionId: txnId,
            vendorId: vendorId,
            items: items,
          }),
        });

        confirmedEl.textContent = `#${res.data.orderId.slice(0, 8).toUpperCase()}`;
        UEM.clearCart();
        UEM.showToast("🎉 Payment verified! Order placed successfully.", "success");
      } catch (err) {
        confirmedEl.textContent = "#PENDING";
        UEM.showToast(`Verification issue: ${err.message}. Your order may still be placed — check My Orders.`, "error");
      }
    }

    confirmPhonePeOrder();
  </script>
</body>
</html>
